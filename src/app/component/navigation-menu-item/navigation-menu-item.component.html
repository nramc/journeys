<a
  [routerLink]="pageInfo().path"
  routerLinkActive="nav-active"
  [attr.aria-label]="pageInfo().name"
  [attr.title]="showLabel() ? null : pageInfo().name"
  class="nav-item">
  <mat-icon class="nav-icon">{{ pageInfo().icon }}</mat-icon>
  <span class="nav-label">{{ pageInfo().name }}</span>
</a>
