<mat-toolbar class="toolbar flex justify-between align-middle">
  <!-- App Brand Section -->
  <div class="app-brand-section flex justify-between align-bottom">
    <button mat-icon-button (click)="toggleNavigation.emit()" aria-label="Toggle navigation" class="menu-button">
      <mat-icon>menu</mat-icon>
    </button>
    <a [routerLink]="HOME_PAGE_INFO.path" class="app-brand">
      <img ngSrc="assets/logo/journey-logo-180x180.png" alt="Journey" class="brand-logo" height="180" width="180"
           priority/>
    </a>
    <a [routerLink]="HOME_PAGE_INFO.path" class="app-name">
      <h1 class="app-title">Journey</h1>
      <span class="app-tagline">Your portal to the past</span>
    </a>
  </div>
  <div class="inline-flex">
    <app-toolbar-actions></app-toolbar-actions>
  </div>
</mat-toolbar>
